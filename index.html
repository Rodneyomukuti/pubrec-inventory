<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PUBReC Lab Inventory</title>
<meta name="description" content="Lab inventory for Pwani University Biosciences Research Centre (PUBReC) research groups.">
<meta name="theme-color" content="#2D306E">
<meta name="author" content="Rodney Omukuti">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PUBReC Inventory">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* PUBReC Lab Inventory — installable app shell. © 2026 Rodney Omukuti */
  :root { --navy: #2D306E; --sky: #1E9FD8; --bg: #F4F6FB; --muted: #6B7090; }
  html, body { margin: 0; height: 100%; background: #fff; font-family: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
  #app { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top, 0px); width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; display: block; background: #fff; }
  .screen { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--bg); padding: 24px; text-align: center; transition: opacity .35s ease; }
  .screen img { width: min(300px, 72vw); height: auto; }
  .screen p { margin: 0; color: var(--muted); font-size: 16px; max-width: 32ch; line-height: 1.5; }
  .bar { width: 160px; height: 4px; border-radius: 4px; background: #DDE2EE; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: var(--sky); border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; } }
  .screen button { font-family: inherit; font-weight: 700; font-size: 16px; line-height: 1; color: #fff; background: var(--navy); border: 0; border-radius: 10px; padding: 14px 22px; cursor: pointer; }
  .copy { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: #9AA0BA; }
  .hide { opacity: 0; pointer-events: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="screen" id="splash" role="status" aria-live="polite">
    <img src="icons/logo.png" alt="PUBReC — Pwani University Biosciences Research Centre">
    <div class="bar" aria-hidden="true"><i></i></div>
    <p>Opening the lab inventory…</p>
    <div class="copy">© <span id="yr">2026</span> Rodney Omukuti · PUBReC Lab Inventory System</div>
  </div>
  <div class="screen" id="offline" hidden>
    <img src="icons/logo.png" alt="PUBReC — Pwani University Biosciences Research Centre">
    <p>You're offline. The inventory needs an internet connection to show live stock.</p>
    <button type="button" id="retry">Try again</button>
  </div>
  <iframe id="app" title="PUBReC Lab Inventory" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  // The live web app (Google Apps Script, owned by pubrec@pu.ac.ke). The /a/macros/pu.ac.ke/ form avoids Google's
  // multi-account error ("Sorry, unable to open the file") and still works for people without a Google login.
  const APP_URL = 'https://script.google.com/a/macros/pu.ac.ke/s/AKfycbxLSSF6RTWd4nJv6SC93uKz8u-kXwImC6RQ7Tdg-t4VVq2yp-a2XViPWI3thPL591Y/exec';

  const frame = document.getElementById('app'), splash = document.getElementById('splash'), offline = document.getElementById('offline');
  document.getElementById('yr').textContent = new Date().getFullYear();
  function load() {
    if (!navigator.onLine) { offline.hidden = false; splash.classList.add('hide'); return; }
    offline.hidden = true; splash.classList.remove('hide');
    frame.src = APP_URL;
  }
  frame.addEventListener('load', () => { if (frame.src) setTimeout(() => splash.classList.add('hide'), 600); });
  document.getElementById('retry').addEventListener('click', load);
  window.addEventListener('online', () => { if (!offline.hidden) load(); });
  load();
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
